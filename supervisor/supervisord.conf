[supervisord]
nodaemon=true
logfile=/home/container/.data/logs/supervisord.log
pidfile=/home/container/.data/run/supervisord.pid
childlogdir=/home/container/.data/logs
loglevel=info

[program:mongodb]
command=/usr/bin/mongod --dbpath /home/container/.data/mongodb --replSet rs0 --bind_ip 127.0.0.1 --port 27017
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/home/container/.data/logs/mongodb.log
stderr_logfile=/home/container/.data/logs/mongodb-error.log
stopasgroup=true
killasgroup=true

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --dir /home/container/.data/redis --appendonly yes --protected-mode yes
priority=10
autostart=true
autorestart=true
stdout_logfile=/home/container/.data/logs/redis.log
stderr_logfile=/home/container/.data/logs/redis-error.log
stopasgroup=true
killasgroup=true

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
directory=/home/container
environment=HOME="/home/container",RABBITMQ_MNESIA_BASE="/home/container/.data/rabbitmq/mnesia",RABBITMQ_LOG_BASE="/home/container/.data/rabbitmq/log",RABBITMQ_PID_FILE="/home/container/.data/run/rabbitmq.pid",RABBITMQ_DEFAULT_USER="rabbituser",RABBITMQ_DEFAULT_PASS="rabbitpass"
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/home/container/.data/logs/rabbitmq.log
stderr_logfile=/home/container/.data/logs/rabbitmq-error.log
stopasgroup=true
killasgroup=true

[program:minio]
command=/usr/local/bin/minio server /home/container/.data/minio --address 127.0.0.1:14009 --console-address 127.0.0.1:14010
environment=HOME="/home/container",MINIO_ROOT_USER="minioautumn",MINIO_ROOT_PASSWORD="minioautumn",MINIO_REGION="minio"
priority=10
autostart=true
autorestart=true
stdout_logfile=/home/container/.data/logs/minio.log
stderr_logfile=/home/container/.data/logs/minio-error.log
stopasgroup=true
killasgroup=true

[program:init-mongodb]
command=/home/container/scripts/init-mongodb.sh
priority=20
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/home/container/.data/logs/init-mongodb.log
stderr_logfile=/home/container/.data/logs/init-mongodb-error.log

[program:init-minio]
command=/home/container/scripts/init-minio.sh
priority=20
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/home/container/.data/logs/init-minio.log
stderr_logfile=/home/container/.data/logs/init-minio-error.log

[program:delta]
command=/home/container/scripts/wait-and-run.sh /home/container/source/target/debug/revolt-delta
directory=/home/container/source
priority=50
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

